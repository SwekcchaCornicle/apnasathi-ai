services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: apnasathi_qa
      POSTGRES_USER: apnasathi
      POSTGRES_PASSWORD: local-qa-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apnasathi -d apnasathi_qa"]
      interval: 2s
      timeout: 3s
      retries: 15
