<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="A little help, a lot closer. Find your people with ApnaSathi." />
    <title>ApnaSathi — Find your people</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const oauthQuery = new URLSearchParams(window.location.search)
      if (window.location.pathname === '/' && oauthQuery.has('state') && (oauthQuery.has('code') || oauthQuery.has('error'))) {
        window.history.replaceState(null, '', '/')
        const callback = document.createElement('form')
        callback.method = 'post'
        callback.action = '/api/v1/instagram/callback'
        for (const name of ['state', 'code']) {
          const field = document.createElement('input')
          field.type = 'hidden'
          field.name = name
          field.value = oauthQuery.get(name) || ''
          callback.append(field)
        }
        document.body.append(callback)
        callback.submit()
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
