[project]
name = "apnasathi-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swekccha", email = "singhswekccha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av==18.1.0",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
apnasathi-ai = "apnasathi_ai:main"

[project.optional-dependencies]
local-voice = [
    "piper-tts==1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
