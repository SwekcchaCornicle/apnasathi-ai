name: Deploy ApnaSathi Application

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apnasathi-manual-ecs-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  CDK_DEFAULT_ACCOUNT: "553607360155"
  ECR_REPOSITORY: apnasathi-backend
  ECS_CLUSTER: apnasathi-dev-cluster
  ECS_SERVICE: apnasathi-backend-service

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrap.yaml

  deploy:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with the backend deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Download and validate the service task definition
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACCOUNT" == "$CDK_DEFAULT_ACCOUNT" ]] || { echo "::error::Unexpected AWS account."; exit 1; }
          SERVICE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0]' --output json)
          CURRENT_TASK=$(jq -er '.taskDefinition' <<< "$SERVICE")
          aws ecs describe-task-definition --task-definition "$CURRENT_TASK" --query taskDefinition --output json > task-definition.json
          jq -e '
            .family == "apnasathi-backend" and .runtimePlatform.cpuArchitecture == "ARM64"
            and ([.containerDefinitions[] | select(.name == "backend")] | length == 1)
            and (.containerDefinitions[] | select(.name == "backend") |
                 ([.secrets[]?.name] | contains(["GOOGLE_WIF_CONFIG_JSON", "WATCHMODE_API_KEY", "INSTAGRAM_APP_SECRET"]))
                 and ([.environment[]?.name] | contains(["INSTAGRAM_API_VERSION", "INSTAGRAM_IMAGE_ORIGIN"])))
          ' task-definition.json > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the hosted frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID || 'ap-south-1_qxfax5y4B' }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID || '6ltn4ni5clgd6b939epjcv78bh' }}
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build, smoke-test, and push immutable ARM64 image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build --platform linux/arm64 --load --tag "$IMAGE" .
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          NAME="apnasathi-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$NAME" --network none --platform linux/arm64 "$IMAGE"
          for attempt in {1..60}; do
            if docker exec "$NAME" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()" 2>/dev/null; then
              docker push "$IMAGE"
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$NAME")" != true ]]; then break; fi
            sleep 2
          done
          docker logs "$NAME"
          exit 1

      - name: Register and roll out the validated image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID || 'ap-south-1_qxfax5y4B' }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID || '6ltn4ni5clgd6b939epjcv78bh' }}
        run: |
          set -euo pipefail
          if [[ ! "$COGNITO_USER_POOL_ID" =~ ^ap-south-1_[a-zA-Z0-9]+$ || ! "$COGNITO_CLIENT_ID" =~ ^[a-zA-Z0-9]{1,128}$ ]]; then
            echo "::error::Set a valid ap-south-1 Cognito user pool and public client ID."
            exit 1
          fi
          jq --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg region "$AWS_REGION" --arg pool "$COGNITO_USER_POOL_ID" --arg client "$COGNITO_CLIENT_ID" '
            (.containerDefinitions[] | select(.name == "backend")) |= (
              .image = $image
              | .environment = (
                [(.environment // [])[] | select(.name != "COGNITO_REGION" and .name != "COGNITO_USER_POOL_ID" and .name != "COGNITO_CLIENT_ID")]
                + [
                  {name: "COGNITO_REGION", value: $region},
                  {name: "COGNITO_USER_POOL_ID", value: $pool},
                  {name: "COGNITO_CLIENT_ID", value: $client}
                ]
              )
            )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' task-definition.json > new-task-definition.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          ACTUAL=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          if [[ "$ACTUAL" != "$TASK_ARN" ]]; then
            echo "::error::ECS stabilized on a different task definition, possibly after rollback."
            exit 1
          fi

      - name: Publish the frontend to the site bucket
        env:
          SITE_BUCKET: ${{ vars.FRONTEND_SITE_BUCKET || 'apnasathi-dev-gateway-site-de8owegqprxa' }}
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist/assets/ "s3://$SITE_BUCKET/assets/" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp frontend/dist/index.html "s3://$SITE_BUCKET/index.html" --content-type text/html --cache-control no-cache

      - name: Check the development HTTPS gateway
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            https://d03k1owznd.execute-api.ap-south-1.amazonaws.com/api/v1/health
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            https://d03k1owznd.execute-api.ap-south-1.amazonaws.com/ -o hosted-index.html
          cmp frontend/dist/index.html hosted-index.html
